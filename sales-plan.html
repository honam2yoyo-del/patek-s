<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>매출 계획 – Patek-S</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Malgun Gothic','맑은 고딕',Arial,sans-serif; background:#e8e4dc; color:#111; font-size:12px; }

/* ── 로그인 ── */
#login-overlay { position:fixed;inset:0;background:rgba(250,249,245,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999; }
#login-overlay img { height:52px;margin-bottom:16px; }
#login-overlay h2 { font-size:22px;font-weight:800;color:#333;margin-bottom:6px; }
#login-overlay p  { font-size:13px;color:#888;margin-bottom:24px; }
.google-btn { display:flex;align-items:center;gap:10px;background:white;border:1.5px solid #ddd;border-radius:50px;padding:11px 24px;font-size:14px;font-weight:700;cursor:pointer; }

/* ── 헤더 바 ── */
#top-bar { background:#3A3532;color:white;padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100; }
#top-bar img { height:24px;object-fit:contain;opacity:.9; }
.month-nav { display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);border-radius:8px;padding:4px 10px; }
.month-nav button { background:none;border:none;cursor:pointer;font-size:18px;color:#fff;line-height:1; }
#month-title { font-size:14px;font-weight:800;color:#fff;min-width:88px;text-align:center; }
.btn { display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:6px;font-size:12px;font-weight:700;border:none;cursor:pointer;white-space:nowrap;transition:.12s; }
.btn:active { opacity:.8; }
.btn-save   { background:#4CAF50;color:#fff; }
.btn-excel  { background:#1976D2;color:#fff; }
.btn-print  { background:#757575;color:#fff; }
.btn-add    { background:#FF9800;color:#fff; }
.btn-logout { background:rgba(255,255,255,.2);color:#fff; }
.spacer { flex:1; }

/* ── 문서 영역 ── */
#doc-wrap { max-width:820px;margin:20px auto;background:white;box-shadow:0 2px 16px rgba(0,0,0,.18);padding:0 0 24px; }

/* ── 제목 ── */
#doc-title-row { text-align:center;padding:14px 20px 8px;font-size:19px;font-weight:800;letter-spacing:.5px;border-bottom:2px solid #222; }
#doc-title-input { background:transparent;border:none;outline:none;text-align:center;font-family:inherit;font-size:19px;font-weight:800;letter-spacing:.5px;width:100%; }

/* ── 헤더 테이블 ── */
.hdr-table { width:100%;border-collapse:collapse;border-bottom:2px solid #222; }
.hdr-table td { border:1px solid #bbb;padding:4px 8px;vertical-align:top; }
.hdr-left   { width:42%;vertical-align:top;padding:8px 10px !important; }
.hdr-right  { width:58%;vertical-align:top;padding:0 !important;border-left:2px solid #555 !important; }

.hdr-section-title { font-size:11px;font-weight:800;color:#444;margin-bottom:2px; }
.hdr-free-text { width:100%;background:transparent;border:none;outline:none;font-family:inherit;font-size:12px;color:#333;resize:none;line-height:1.65; }

/* 우측 블록들 */
.hdr-date-row { text-align:right;padding:4px 10px;font-size:11px;color:#555;border-bottom:1px solid #ddd; }
.hdr-date-input { background:transparent;border:none;outline:none;font-family:inherit;font-size:11px;color:#555;text-align:right; }

.hdr-stat-table { width:100%;border-collapse:collapse; }
.hdr-stat-table td { padding:4px 10px;border-bottom:1px solid #eee; }
.hdr-stat-label { font-size:12px;color:#444;white-space:nowrap;width:100px; }
.hdr-stat-val { font-size:13px;font-weight:800;text-align:right; }
.hdr-stat-val input { background:transparent;border:none;outline:none;font-family:inherit;font-size:13px;font-weight:800;text-align:right;width:100%; }

.hdr-note-row { background:#FFFDE7;border-top:1px solid #F5D800;border-bottom:1px solid #F5D800;padding:5px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap; }
.hdr-note-input { flex:1;min-width:100px;background:transparent;border:none;outline:none;font-family:inherit;font-size:11px;color:#555; }
.hdr-note-amt   { width:140px;text-align:right;background:transparent;border:none;outline:none;font-family:inherit;font-size:12px;font-weight:800;color:#1565C0; }
.hdr-note-sep   { color:#999;font-size:11px;white-space:nowrap; }
.hdr-note-prev  { width:130px;text-align:right;background:transparent;border:none;outline:none;font-family:inherit;font-size:12px;font-weight:700;color:#333; }

.hdr-confirm-table { width:100%;border-collapse:collapse;background:#FFF9C4; }
.hdr-confirm-table td { padding:5px 10px;border-bottom:1px solid #EDD84A; }
.hdr-conf-label { font-size:13px;font-weight:800;color:#2B1A0A;white-space:nowrap;width:100px; }
.hdr-conf-val { text-align:right; }
.hdr-conf-val input { background:transparent;border:none;outline:none;font-family:inherit;font-size:14px;font-weight:800;color:#222;text-align:right;width:100%; }
.hdr-conf-prev { width:120px; }
.hdr-conf-prev input { background:transparent;border:none;outline:none;font-family:inherit;font-size:12px;font-weight:700;color:#666;text-align:right;width:100%; }

/* ── 데이터 테이블 ── */
#data-wrap { padding:0;overflow-x:auto; }
table.data { width:100%;border-collapse:collapse; }
table.data th { background:#F0EBE0;border:1px solid #bbb;padding:7px 8px;font-size:12px;font-weight:800;text-align:center;white-space:nowrap; }
table.data td { border:1px solid #ddd;padding:5px 8px;font-size:12px;vertical-align:middle; }

.col-ref   { text-align:left;min-width:130px; }
.col-price { text-align:right;min-width:120px; }
.col-cur   { text-align:left;min-width:150px; }
.col-car   { text-align:left;min-width:150px; }
.col-act   { width:56px;text-align:center;white-space:nowrap; }

.cell-edit { outline:none;display:block;width:100%; }
.cell-edit:focus { background:#EEF4FF; }
.price-cell { text-align:right; }

tr.row-default td { background:white; }
tr.row-blue td    { color:#1565C0;background:#F3F7FF; }
tr.row-red  td    { color:#C62828;background:#FFF5F5; }

tr.total-row td { background:#F5F0E6;font-weight:800;font-size:12px;color:#222 !important; }
tr.total-row td.col-price,
tr.total-row td.col-cur,
tr.total-row td.col-car { text-align:right; }
tr.total-row td:first-child { text-align:left; }

.color-sel { background:transparent;border:1px solid #ccc;border-radius:3px;font-size:10px;padding:1px 2px;cursor:pointer;width:40px; }
.del-btn   { background:none;border:none;cursor:pointer;color:#ccc;font-size:13px;padding:1px 4px; }
.del-btn:hover { color:#e53935; }

/* ── 푸터 메모 ── */
#footer-area { padding:10px 14px 4px;border-top:2px solid #222; }
.footer-title { font-size:11px;font-weight:800;color:#888;margin-bottom:4px; }
#footer-notes { width:100%;background:transparent;border:none;outline:none;font-family:inherit;font-size:12px;color:#333;resize:none;line-height:1.8;min-height:36px; }

/* ── 인쇄 ── */
@media print {
  body { background:white; }
  #top-bar,#login-overlay { display:none !important; }
  #doc-wrap { max-width:100%;margin:0;box-shadow:none; }
  .del-btn,.color-sel { display:none !important; }
  .col-act { display:none !important; }
}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-overlay">
  <img src="log.png" alt="Patek-S" onerror="this.style.display='none'"/>
  <h2>매출 계획</h2>
  <p>Google 계정으로 로그인하세요</p>
  <button class="google-btn" id="login-btn">
    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Google로 로그인
  </button>
</div>

<!-- 상단 바 -->
<div id="top-bar">
  <img src="log.png" onerror="this.style.display='none'"/>
  <div class="month-nav">
    <button id="prev-btn">‹</button>
    <span id="month-title">로딩 중...</span>
    <button id="next-btn">›</button>
  </div>
  <button class="btn btn-add" id="add-row-btn">＋ 행 추가</button>
  <button class="btn btn-save" id="save-btn">💾 저장</button>
  <button class="btn btn-excel" id="export-btn">⬇ 엑셀</button>
  <button class="btn btn-print" onclick="window.print()">🖨 인쇄</button>
  <span class="spacer"></span>
  <button class="btn btn-logout" id="logout-btn">로그아웃</button>
</div>

<!-- 문서 본체 -->
<div id="doc-wrap">

  <!-- 제목 -->
  <div id="doc-title-row">
    <input id="doc-title-input" type="text" value="X월 매출 계획" />
  </div>

  <!-- 헤더 정보 -->
  <table class="hdr-table">
    <tr>
      <!-- 왼쪽: 전월 매출 + 남은 목표 -->
      <td class="hdr-left" rowspan="4">
        <div class="hdr-section-title">※전월 매출</div>
        <textarea class="hdr-free-text" id="prev-month-text" rows="3"
          placeholder="AV : 2,161,730,000원 (10PCS)&#10;CT : 2,122,060,000원 (16PCS)"></textarea>
        <div class="hdr-section-title" style="margin-top:10px;">※남은 목표 금액</div>
        <textarea class="hdr-free-text" id="remaining-target-text" rows="4"
          placeholder="전체: 10,716,210,000원&#10;AV: 6,088,270,000원&#10;센텀: 4,627,940,000원"></textarea>
      </td>
      <!-- 오른쪽 날짜 -->
      <td class="hdr-date-row">
        <input class="hdr-date-input" id="report-date" type="date"/>
      </td>
    </tr>
    <tr>
      <!-- 월 판매 매출 / QTY -->
      <td style="padding:0 !important;border-left:2px solid #555 !important;">
        <table class="hdr-stat-table">
          <tr>
            <td class="hdr-stat-label">월 판매 매출</td>
            <td class="hdr-stat-val"><input id="month-sales-amount" type="number" placeholder="0"/></td>
          </tr>
          <tr>
            <td class="hdr-stat-label">월 판매 QTY</td>
            <td class="hdr-stat-val"><input id="month-sales-qty" type="number" placeholder="0"/></td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <!-- 특이사항 행 (노란 하이라이트) -->
      <td style="padding:0 !important;border-left:2px solid #555 !important;">
        <div class="hdr-note-row">
          <input class="hdr-note-input" id="special-note" type="text" placeholder="특이사항 (예: 임정석님 선수금(2억) 포함)"/>
          <input class="hdr-note-amt" id="special-note-amount" type="number" placeholder="금액"/>
          <span class="hdr-note-sep">│ 전년매출</span>
          <input class="hdr-note-prev" id="prev-year-sales" type="number" placeholder="0"/>
        </div>
      </td>
    </tr>
    <tr>
      <!-- 확정 매출 / 예상 Qty (노란 배경) -->
      <td style="padding:0 !important;border-left:2px solid #555 !important;">
        <table class="hdr-confirm-table">
          <tr>
            <td class="hdr-conf-label" id="confirmed-label">X월 확정 매출</td>
            <td class="hdr-conf-val"><input id="confirmed-amount" type="number" placeholder="0"/></td>
            <td class="hdr-conf-prev"><input id="prev-year-confirmed" type="number" placeholder="전년 확정액"/></td>
          </tr>
          <tr>
            <td class="hdr-conf-label" id="qty-label">X월 예상 Qty</td>
            <td class="hdr-conf-val"><input id="expected-qty" type="number" placeholder="0"/></td>
            <td class="hdr-conf-prev"><input id="prev-year-qty" type="number" placeholder="전년 Qty"/></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

  <!-- 데이터 테이블 -->
  <div id="data-wrap">
    <table class="data" id="plan-table">
      <thead>
        <tr>
          <th class="col-ref">Ref.</th>
          <th class="col-price">판매가</th>
          <th class="col-cur">당월 결제 예정</th>
          <th class="col-car">이월 예정(컨펌전)</th>
          <th class="col-act"></th>
        </tr>
      </thead>
      <tbody id="plan-tbody"></tbody>
      <tfoot id="plan-tfoot"></tfoot>
    </table>
  </div>

  <!-- 푸터 메모 -->
  <div id="footer-area">
    <div class="footer-title">기타 메모</div>
    <textarea id="footer-notes" rows="2" placeholder="★ 5524R,6119G 제외 실재고 : 34PCS&#10;★ MPDS 가능 수량 : 31PCS"></textarea>
  </div>

</div><!-- /doc-wrap -->

<script type="module" src="sales-plan.js"></script>
</body>
</html>
