<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스케줄 생성기 – Patek-S</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Malgun Gothic','맑은 고딕',Arial,sans-serif; background:#f8f5ef; color:#3a2a1f; min-height:100vh; }

/* ── 로그인 ── */
#login-overlay { position:fixed; inset:0; background:rgba(250,249,245,.97); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
#login-overlay img { height:56px; margin-bottom:18px; }
#login-overlay h2 { font-size:22px; font-weight:800; color:#333; margin-bottom:6px; }
#login-overlay p { font-size:14px; color:#888; margin-bottom:26px; }
.google-btn { display:flex; align-items:center; gap:10px; background:white; border:1.5px solid #E8E4DB; border-radius:50px; padding:12px 24px; font-size:15px; font-weight:700; color:#4A443F; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.08); transition:.15s; }
.google-btn:hover { box-shadow:0 4px 16px rgba(0,0,0,.12); transform:translateY(-1px); }

/* ── 오버레이 공통 ── */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:500; display:none; align-items:center; justify-content:center; }
.panel { background:white; border-radius:20px; padding:26px; width:500px; max-width:94vw; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); position:relative; }
.panel h3 { font-size:17px; font-weight:800; margin-bottom:10px; }
.panel p { font-size:13px; color:#666; margin-bottom:14px; line-height:1.6; }
.panel-close { position:absolute; top:14px; right:18px; background:none; border:none; font-size:22px; cursor:pointer; color:#999; }

/* ── 설정 패널 ── */
.settings-tbl { width:100%; border-collapse:collapse; font-size:13px; }
.settings-tbl th { background:#F8F6F0; padding:7px 10px; font-weight:800; border:1px solid #E8E4DB; text-align:center; }
.settings-tbl td { padding:6px 8px; border:1px solid #E8E4DB; text-align:center; }
.settings-tbl input { width:70px; padding:4px 6px; border:1px solid #ccc; border-radius:6px; text-align:center; font-size:13px; }

/* ── 신청 반영 패널 ── */
#apply-list { border:1px solid #E8E4DB; border-radius:10px; overflow:hidden; margin-bottom:16px; max-height:260px; overflow-y:auto; }
#apply-list table { width:100%; border-collapse:collapse; font-size:12px; }
#apply-list th { background:#F8F6F0; padding:7px 10px; font-weight:800; border-bottom:1px solid #E8E4DB; text-align:center; }
#apply-list td { padding:6px 10px; border-bottom:1px solid #F0EFEA; text-align:center; }
#apply-list tr:last-child td { border-bottom:none; }
.code-badge { display:inline-block; padding:2px 7px; border-radius:4px; font-size:11px; font-weight:800; background:#FFE146; color:#555; }

/* ── 헤더 ── */
header { background:white; border-bottom:1px solid #E8E4DB; padding:9px 18px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,.04); flex-wrap:wrap; gap:8px; }
.h-logo { display:flex; align-items:center; gap:10px; }
.h-logo img { height:30px; object-fit:contain; }
.h-logo span { font-size:17px; font-weight:800; color:#333; }
.month-nav { display:flex; align-items:center; gap:6px; background:#FFFDF8; border:2px solid #D8B98B; border-radius:11px; padding:5px 12px; }
.month-nav button { background:none; border:none; cursor:pointer; font-size:20px; color:#B4975A; line-height:1; }
#month-title { font-size:15px; font-weight:800; color:#2F2924; min-width:96px; text-align:center; }
.hdr-btns { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; gap:5px; padding:7px 13px; border-radius:9px; font-size:12px; font-weight:800; border:none; cursor:pointer; transition:.15s; white-space:nowrap; }
.btn:active { transform:scale(.97); }
.btn-gold  { background:#F8F3E7; color:#8B6B2E; border:1.5px solid #D8B98B; }
.btn-apply { background:#E8F0FE; color:#1A56DB; border:1.5px solid #A3C0FF; }
.btn-save  { background:#E8F5E9; color:#2E7D32; border:1.5px solid #C8E6C9; }
.btn-excel { background:#F0F4FF; color:#3B5EAA; border:1.5px solid #B3C4F0; }
.btn-print { background:#F5F5F5; color:#555; border:1.5px solid #DDD; }
.btn-red   { background:#FFF3E0; color:#E65100; border:1.5px solid #FFCC80; }
.panel-save-btn { width:100%; margin-top:14px; padding:12px; background:#1A56DB; color:white; border:none; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; }
.panel-save-btn:hover { background:#1344B8; }
.panel-cancel-btn { width:100%; margin-top:8px; padding:11px; background:#F2EFE8; color:#4A443F; border:none; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; }

/* ── 메인 ── */
main { padding:14px 18px 24px; }
#loading { text-align:center; padding:60px; color:#888; font-size:16px; }
#table-wrap { overflow-x:auto; border-radius:12px; border:2px solid #D8C9A8; box-shadow:0 4px 20px rgba(139,115,85,.1); }

/* ── 스케줄 테이블 ── */
.sched { border-collapse:collapse; min-width:max-content; background:white; }
.sched th, .sched td { border:1px solid #E0D3BB; }

/* 고정 컬럼 */
.s-annual { position:sticky; left:0; z-index:5; min-width:48px; max-width:48px; background:#F5F0E8; font-size:12px; font-weight:800; color:#7A5E28; text-align:center; padding:6px 3px; }
.s-name   { position:sticky; left:48px; z-index:5; min-width:68px; max-width:68px; background:#F5F0E8; font-size:13px; font-weight:800; color:#333; padding:7px 9px; white-space:nowrap; border-right:2px solid #C8B095 !important; }
thead .s-annual, thead .s-name { z-index:15; background:#EDE0CB; }

/* 날짜 헤더 */
.th-d { min-width:30px; max-width:30px; padding:5px 1px; text-align:center; font-size:12px; font-weight:800; background:#F5F0E8; }
.th-w { min-width:30px; max-width:30px; padding:3px 1px; text-align:center; font-size:10px; font-weight:700; background:#F5F0E8; }
.red-hdr { color:#C74A4A !important; }
.week-sep { border-right:2.5px solid #8B7355 !important; }

/* 요약 헤더 */
.th-sum { min-width:36px; padding:5px 3px; text-align:center; font-size:11px; font-weight:800; background:#EDE0CB; }

/* 데이터 셀 */
.td-edit {
  min-width:30px; max-width:30px; padding:3px 1px;
  text-align:center; font-size:11px; font-weight:800;
  vertical-align:middle; cursor:text; outline:none;
  user-select:text; -webkit-user-select:text;
}
.td-edit:focus { box-shadow:inset 0 0 0 2px #1A56DB; background:#EEF4FF !important; }
.td-edit[data-req="1"] { background:#FFE146; }
.td-edit[data-caloff="1"] { background:#BEBEBE !important; color:#fff !important; }
.td-edit[data-event="1"] { background:#C8F0B4 !important; }
.td-sum { min-width:36px; padding:5px 4px; text-align:center; font-size:12px; font-weight:800; color:#333; background:#FDFAF5; }
.td-a { color:#6E2626; } .td-b { color:#234B7A; } .td-c { color:#7A4F14; }

/* ── 푸터 ── */
#footer-area { display:none; flex-wrap:wrap; gap:20px; margin-top:16px; padding:14px 16px; background:white; border-radius:12px; border:1px solid #E8E4DB; }
.ft-block h4 { font-size:12px; font-weight:800; color:#777; margin-bottom:8px; letter-spacing:.3px; text-transform:uppercase; }
.ft-shift-tbl { border-collapse:collapse; font-size:12px; }
.ft-shift-tbl th { background:#F8F6F0; padding:5px 12px; font-weight:800; border:1px solid #E8E4DB; }
.ft-shift-tbl td { padding:4px 12px; border:1px solid #E8E4DB; }
.region-list { font-size:12px; line-height:1.8; color:#444; min-width:200px; }
.region-list .no-data { color:#bbb; font-style:italic; }
.time-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.time-chip { display:flex; align-items:center; gap:5px; padding:5px 10px; background:#D9FAF1; border:1px solid #4DB5A9; border-radius:20px; font-size:12px; font-weight:800; color:#167B72; white-space:nowrap; }

@media print {
  header, #footer-area { display:none !important; }
  body { background:white; }
  .s-annual, .s-name { position:static; }
}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-overlay">
  <img src="log.png" alt="Patek-S" onerror="this.style.display='none'" />
  <h2>스케줄 생성기</h2>
  <p>Google 계정으로 로그인하세요</p>
  <button class="google-btn" id="login-btn">
    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Google로 로그인
  </button>
</div>

<!-- 직원 설정 -->
<div class="overlay" id="settings-overlay">
  <div class="panel">
    <button class="panel-close" onclick="document.getElementById('settings-overlay').style.display='none'">✕</button>
    <h3>직원별 설정</h3>
    <p>연차 배분(일)과 시간찾기 잔여(h)를 입력 후 저장하세요.</p>
    <table class="settings-tbl"><thead><tr><th>이름</th><th>연차 배분</th><th>시간찾기 잔여</th></tr></thead>
    <tbody id="settings-tbody"></tbody></table>
    <button class="panel-save-btn" id="settings-save-btn">저장하기</button>
  </div>
</div>

<!-- 신청 반영 확인 -->
<div class="overlay" id="apply-overlay">
  <div class="panel">
    <button class="panel-close" onclick="document.getElementById('apply-overlay').style.display='none'">✕</button>
    <h3>신청 반영하기</h3>
    <p id="apply-desc"></p>
    <div id="apply-list"></div>
    <button class="panel-save-btn" id="apply-confirm-btn">반영하기</button>
    <button class="panel-cancel-btn" onclick="document.getElementById('apply-overlay').style.display='none'">취소</button>
  </div>
</div>

<!-- 헤더 -->
<header>
  <div class="h-logo">
    <img src="log.png" alt="Patek-S" onerror="this.style.display='none'" />
    <span>스케줄 생성기</span>
  </div>
  <div class="month-nav">
    <button id="prev-btn">‹</button>
    <span id="month-title">로딩 중...</span>
    <button id="next-btn">›</button>
  </div>
  <span id="holiday-count" style="font-size:12px;font-weight:800;color:#C74A4A;background:#FFF5F5;border:1px solid #FFD0D0;border-radius:8px;padding:4px 10px;white-space:nowrap;"></span>
  <div class="hdr-btns">
    <button class="btn btn-gold" id="settings-btn">⚙ 직원 설정</button>
    <button class="btn btn-apply" id="apply-btn">✔ 신청 반영하기</button>
    <button class="btn btn-save" id="save-btn">💾 저장하기</button>
    <button class="btn btn-excel" id="export-btn">⬇ 엑셀</button>
    <button class="btn btn-print" onclick="window.print()">🖨 인쇄</button>
    <button class="btn btn-red" id="logout-btn">로그아웃</button>
  </div>
</header>

<main>
  <div id="loading">로딩 중...</div>
  <div id="table-wrap" style="display:none;"></div>
  <div id="footer-area">
    <div class="ft-block">
      <h4>근무 시간</h4>
      <table class="ft-shift-tbl">
        <tr><th></th><th>평일</th><th>주말</th></tr>
        <tr><td style="background:#FAD7D5;color:#6E2626;font-weight:900;padding:4px 10px;">A</td><td>10:00 ~ 18:00</td><td>10:00 ~ 18:00</td></tr>
        <tr><td style="background:#D9E7FA;color:#234B7A;font-weight:900;padding:4px 10px;">B</td><td>12:00 ~ 20:00</td><td>12:30 ~ 20:30</td></tr>
        <tr><td style="background:#FFE7B8;color:#7A4F14;font-weight:900;padding:4px 10px;">C</td><td>10:00 ~ 20:00</td><td>10:00 ~ 20:30</td></tr>
      </table>
    </div>
    <div class="ft-block">
      <h4>지역(사유)</h4>
      <div id="region-list" class="region-list"><span class="no-data">없음</span></div>
    </div>
    <div class="ft-block">
      <h4>시간찾기 잔여</h4>
      <div id="time-chips" class="time-grid"></div>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const FC = { apiKey:"AIzaSyCt7aQXA5eFdnDTMHlRhjPAkyH4b8UB6HY", authDomain:"patek-s.firebaseapp.com", projectId:"patek-s", storageBucket:"patek-s.firebasestorage.app", messagingSenderId:"786016749285", appId:"1:786016749285:web:58538eec1cf7e72068b60c" };
const app = initializeApp(FC);
const auth = getAuth(app);
const db   = getFirestore(app);
const gp   = new GoogleAuthProvider();

const HOLIDAYS = { "2026-01-01":"신정","2026-02-16":"설날연휴","2026-02-17":"설날","2026-02-18":"설날연휴","2026-03-01":"삼일절","2026-03-02":"대체공휴일","2026-05-05":"어린이날","2026-05-24":"부처님오신날","2026-05-25":"대체공휴일","2026-06-03":"지방선거","2026-06-06":"현충일","2026-08-15":"광복절","2026-08-17":"대체공휴일","2026-09-24":"추석연휴","2026-09-25":"추석","2026-09-26":"추석연휴","2026-09-28":"대체공휴일","2026-10-03":"개천절","2026-10-05":"대체공휴일","2026-10-09":"한글날","2026-12-25":"기독탄신일" };
const DNAMES = ['일','월','화','수','목','금','토'];
const DEF_ANNUAL = { '옥영세':15,'엄인주':13.5,'장용석':10.5,'최혜지':17,'이승범':6,'형영지':9 };
const DEF_TIME   = { '엄인주':0.5,'장용석':1.5,'최혜지':1.5,'형영지':0.5 };

let curYear=2026, curMonth=7;
let schedulesData={}, leaveRequests=[], calEvents=[], timeRequests=[], staffList=[];

const pad = n => String(n).padStart(2,'0');
const getDays = (y,m) => new Date(y,m,0).getDate();
const ds = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;

/* ── 표시 코드 변환 ── */
function dispCode(raw) {
  const u = String(raw||'').trim().toUpperCase();
  if (!u || u==='/' || u==='휴' || u==='휴무') return '/';
  if (u==='A반' || u==='A반차' || u==='A반차') return 'A반';
  if (u==='B반' || u==='B반차') return 'B반';
  if (u==='A') return 'A';
  if (u==='B') return 'B';
  if (u==='C') return 'C';
  if (u==='연차'||u==='연') return '연';
  if (u==='경조'||u==='경') return '경';
  return raw || '/';
}

/* 저장용 코드로 역변환 */
function storeCode(disp) {
  const u = String(disp||'').trim().toUpperCase();
  if (u==='/' || !u) return '';
  if (u==='연') return '연차';
  if (u==='경') return '경조';
  if (u==='A반') return 'A반';
  if (u==='B반') return 'B반';
  return u; // A, B, C as-is
}

/* ── 렌더 ── */
function render() {
  const total = getDays(curYear, curMonth);
  const mKey  = `${curYear}-${pad(curMonth)}`;
  document.getElementById('month-title').textContent = `${curYear}년 ${curMonth}월`;

  const mDoc      = schedulesData[mKey] || {};
  const staffNames = mDoc.staffNames || Object.keys(DEF_ANNUAL);

  // calEvent map
  const calMap = {};
  calEvents.forEach(e => { calMap[e.date] = e; });

  // leave request matrix: name → day → type (requested)
  const reqM = {};
  staffNames.forEach(n => { reqM[n] = {}; });
  leaveRequests.forEach(req => {
    if (!reqM[req.name]) return;
    const s=new Date(req.startDate), e=new Date(req.endDate||req.startDate);
    for (let d=new Date(s); d<=e; d.setDate(d.getDate()+1))
      if (d.getFullYear()===curYear && d.getMonth()+1===curMonth)
        reqM[req.name][d.getDate()] = req.type;
  });

  // schedule matrix: name → day → code (admin-set)
  const schM = {};
  staffNames.forEach(n => {
    schM[n] = {};
    const uD = (mDoc.staffs||{})[n] || {};
    for (let d=1; d<=total; d++) schM[n][d] = uD[d]||uD[String(d)]||'';
  });

  // time used
  const tUsed = {};
  timeRequests.forEach(r => { tUsed[r.name] = (tUsed[r.name]||0)+(r.hours||0); });

  // staffMeta
  const sMeta = {};
  staffList.forEach(s => { sMeta[s.name] = { annual: s.annualLeave??DEF_ANNUAL[s.name]??15, time: s.timeAllowance??DEF_TIME[s.name]??0 }; });

  /* ── 헤더 행 1: 날짜 번호 ── */
  let thD = `<th class="s-annual" rowspan="2" style="background:#EDE0CB;">연차</th>
             <th class="s-name" rowspan="2" style="background:#EDE0CB;border-right:2px solid #C8B095 !important;">이름</th>`;
  let thW = '';
  for (let d=1; d<=total; d++) {
    const date = ds(curYear,curMonth,d);
    const dow  = new Date(curYear,curMonth-1,d).getDay();
    const isHol = !!HOLIDAYS[date];
    const cal   = calMap[date];
    const isClosed = cal?.type==='정기휴무';
    const isEvent  = cal?.type==='행사';
    const isSunday = dow===0;
    const isRed    = isHol || dow===0 || dow===6;
    const wSep     = isSunday ? ' week-sep' : '';
    const colBg    = isClosed ? 'background:#BEBEBE;' : isEvent ? 'background:#C8F0B4;' : '';
    const rCls     = isRed ? ' red-hdr' : '';
    thD += `<th class="th-d${wSep}${rCls}" style="${colBg}">${d}</th>`;
    thW += `<th class="th-w${wSep}${rCls}" style="${colBg}">${DNAMES[dow]}${isHol?'*':''}</th>`;
  }
  ['DO','A','B','C','사용연차','남은연차'].forEach(s => { thD += `<th class="th-sum" rowspan="2">${s}</th>`; });

  /* ── 데이터 행 ── */
  let rows = '';
  staffNames.forEach(name => {
    const meta = sMeta[name] || { annual: DEF_ANNUAL[name]??15, time: DEF_TIME[name]??0 };
    let cA=0, cB=0, cC=0, cAnn=0, cOff=0;
    let cells = '';

    for (let d=1; d<=total; d++) {
      const date  = ds(curYear,curMonth,d);
      const dow   = new Date(curYear,curMonth-1,d).getDay();
      const cal   = calMap[date];
      const isClosed = cal?.type==='정기휴무';
      const isEvent  = cal?.type==='행사';
      const isSunday = dow===0;

      const schedVal = schM[name][d];   // admin-set or ''
      const reqVal   = reqM[name][d];   // requested or undefined

      let code='', isReq=false;
      if (schedVal && reqVal) {
        // 스케줄 데이터와 신청이 둘 다 있으면 → 신청 반영된 것 → 노란색
        code = schedVal; isReq = true;
      } else if (schedVal) {
        code = schedVal; isReq = false;  // 관리자 입력만 → 흰색
      } else if (reqVal) {
        code = reqVal;   isReq = true;   // 신청만 → 노란색
      }

      const disp = dispCode(code);
      const norm = disp.replace('반차','반').toUpperCase();
      if (norm==='A'||norm==='A반') cA++;
      else if (norm==='B'||norm==='B반') cB++;
      else if (norm==='C') cC++;
      else if (disp==='연') cAnn++;
      else cOff++;

      // 셀 스타일
      let dataClosed = isClosed ? ' data-caloff="1"' : '';
      let dataEvent  = isEvent  ? ' data-event="1"' : '';
      let dataReq    = (!isClosed && !isEvent && isReq) ? ' data-req="1"' : '';
      const wSep = isSunday ? ' week-sep' : '';

      cells += `<td class="td-edit${wSep}" contenteditable="true" data-staff="${name}" data-day="${d}"${dataClosed}${dataEvent}${dataReq} onblur="normalizeCell(this)" onkeydown="handleKey(event,this)" onpaste="handlePaste(event)">${disp}</td>`;
    }

    const annual  = meta.annual;
    const annUsed = cAnn;
    const annRem  = (annual - annUsed).toFixed(1);

    rows += `<tr>
      <td class="s-annual">${annual}</td>
      <td class="s-name">${name}</td>
      ${cells}
      <td class="td-sum" data-col="do">${cOff}</td>
      <td class="td-sum td-a" data-col="a">${cA}</td>
      <td class="td-sum td-b" data-col="b">${cB}</td>
      <td class="td-sum td-c" data-col="c">${cC}</td>
      <td class="td-sum" data-col="uann">${annUsed}.0</td>
      <td class="td-sum" data-col="rann" style="color:#2E7D32;">${annRem}</td>
    </tr>`;
  });

  document.getElementById('table-wrap').innerHTML =
    `<table class="sched" id="sched-table">
      <thead><tr>${thD}</tr><tr>${thW}</tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  renderFooter(staffNames, sMeta, tUsed);
  // 법정공휴일 수 업데이트
  let holCount = 0;
  for (let d=1; d<=total; d++) { if (HOLIDAYS[ds(curYear,curMonth,d)]) holCount++; }
  const hcEl = document.getElementById('holiday-count');
  if (hcEl) hcEl.textContent = `법정공휴일 ${holCount}일`;

  document.getElementById('loading').style.display='none';
  document.getElementById('table-wrap').style.display='block';
  document.getElementById('footer-area').style.display='flex';
}

/* ── 푸터 렌더 ── */
function renderFooter(staffNames, sMeta, tUsed) {
  // 지역(사유)
  const regionEl = document.getElementById('region-list');
  const regionList = leaveRequests.filter(req => {
    if (!req.region) return false;
    const s=new Date(req.startDate), e=new Date(req.endDate||req.startDate);
    const days = Math.ceil((e-s)/86400000)+1;
    if (days<3) return false;
    return (s.getFullYear()===curYear&&s.getMonth()+1===curMonth)||(e.getFullYear()===curYear&&e.getMonth()+1===curMonth);
  });
  if (regionList.length===0) {
    regionEl.innerHTML='<span class="no-data">없음</span>';
  } else {
    regionEl.innerHTML = regionList.map(r =>
      `<div>• <strong>${r.name}</strong> ${r.startDate}${r.endDate&&r.endDate!==r.startDate?` ~ ${r.endDate}`:''} <span style="color:#B4975A;">[${r.region}]</span></div>`
    ).join('');
  }

  // 시간찾기 잔여 (2x2, 잔여>0만)
  const timeEl = document.getElementById('time-chips');
  const chips = staffNames
    .map(n => { const alloc=(sMeta[n]?.time||DEF_TIME[n]||0); const rem=Math.max(0,alloc-(tUsed[n]||0)); return rem>0?{name:n,rem}:null; })
    .filter(Boolean);
  timeEl.innerHTML = chips.length===0
    ? '<span style="color:#bbb;font-size:12px;">없음</span>'
    : chips.map(c=>`<span class="time-chip">${c.name}: ${c.rem.toFixed(1)}h</span>`).join('');
}

/* ── 인라인 편집 ── */
window.normalizeCell = function(el) {
  const raw = el.textContent.trim();
  const norm = dispCode(raw);
  if (el.textContent !== norm) el.textContent = norm;
  updateRowSummary(el.closest('tr'));
};

window.handleKey = function(e, el) {
  if (e.key==='Enter') { e.preventDefault(); el.blur(); }
  if (e.key==='Tab') { e.preventDefault(); el.blur(); const cells=document.querySelectorAll('.td-edit'); const idx=Array.from(cells).indexOf(el); if(cells[idx+(e.shiftKey?-1:1)]) cells[idx+(e.shiftKey?-1:1)].focus(); }
};

window.handlePaste = function(e) {
  e.preventDefault();
  const text = (e.clipboardData||window.clipboardData).getData('text/plain').trim();
  document.execCommand('insertText',false,text);
};

function updateRowSummary(tr) {
  if (!tr) return;
  const cells=tr.querySelectorAll('.td-edit');
  let cA=0,cB=0,cC=0,cAnn=0,cOff=0;
  cells.forEach(c=>{
    const v=dispCode(c.textContent);
    const u=v.toUpperCase();
    if(u==='A'||u==='A반') cA++;
    else if(u==='B'||u==='B반') cB++;
    else if(u==='C') cC++;
    else if(v==='연') cAnn++;
    else cOff++;
  });
  const annual = parseFloat(tr.querySelector('.s-annual')?.textContent)||15;
  const sums = tr.querySelectorAll('.td-sum');
  if(sums[0]) sums[0].textContent=cOff;
  if(sums[1]) sums[1].textContent=cA;
  if(sums[2]) sums[2].textContent=cB;
  if(sums[3]) sums[3].textContent=cC;
  if(sums[4]) sums[4].textContent=cAnn+'.0';
  if(sums[5]) sums[5].textContent=(annual-cAnn).toFixed(1);
}

/* ── 저장하기 ── */
document.getElementById('save-btn').addEventListener('click', async () => {
  const table = document.getElementById('sched-table');
  if (!table) return;
  const mKey  = `${curYear}-${pad(curMonth)}`;
  const mDoc  = schedulesData[mKey]||{};
  const staffNames = mDoc.staffNames || Object.keys(DEF_ANNUAL);
  const newStaffs = {};
  table.querySelectorAll('tbody tr').forEach(tr => {
    const nameEl = tr.querySelector('.s-name');
    if (!nameEl) return;
    const name = nameEl.textContent.trim();
    newStaffs[name] = {};
    tr.querySelectorAll('.td-edit').forEach(td => {
      const day = td.dataset.day;
      const disp = td.textContent.trim();
      const stored = storeCode(disp);
      newStaffs[name][day] = stored;
    });
  });
  const now = new Date();
  const ts = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  try {
    await setDoc(doc(db,'artifacts','patek-s','public','data','schedules',mKey), {
      staffs: newStaffs, staffNames,
      lastUpdated: ts, updatedBy: auth.currentUser?.displayName||auth.currentUser?.email||'생성기'
    }, { merge: true });
    alert('✅ 저장됐습니다!');
  } catch(e) { alert('오류: '+e.message); }
});

/* ── 신청 반영하기 ── */
document.getElementById('apply-btn').addEventListener('click', () => {
  const mKey  = `${curYear}-${pad(curMonth)}`;
  const mDoc  = schedulesData[mKey]||{};
  const staffNames = mDoc.staffNames || Object.keys(DEF_ANNUAL);
  const calMap = {}; calEvents.forEach(e=>{ calMap[e.date]=e; });

  const items = leaveRequests.filter(req => {
    const s=new Date(req.startDate), e=new Date(req.endDate||req.startDate);
    return (s.getFullYear()===curYear&&s.getMonth()+1===curMonth)||(e.getFullYear()===curYear&&e.getMonth()+1===curMonth);
  });

  if (items.length===0) { alert(`${curYear}년 ${curMonth}월에 반영할 신청 내역이 없습니다.`); return; }

  const tbody = items.map(r=>{
    const s=new Date(r.startDate),e=new Date(r.endDate||r.startDate);
    const days=Math.ceil((e-s)/86400000)+1;
    const regionTxt = days>=3&&r.region ? `<td style="color:#B4975A;font-weight:800;">${r.region}</td>` : '<td style="color:#aaa;">-</td>';
    return `<tr><td style="font-weight:700;">${r.name}</td><td>${r.startDate}${r.endDate&&r.endDate!==r.startDate?`~${r.endDate}`:''}</td><td><span class="code-badge">${r.type}</span></td>${regionTxt}</tr>`;
  }).join('');

  document.getElementById('apply-desc').innerHTML = `<strong>${curYear}년 ${curMonth}월</strong> 신청 내역 <strong>${items.length}건</strong>을 근무표에 반영합니다.<br>기존 데이터는 신청 내용으로 <strong style="color:#C0392B;">덮어씌워집니다.</strong>`;
  document.getElementById('apply-list').innerHTML = `<table><thead><tr><th>이름</th><th>날짜</th><th>종류</th><th>지역(사유)</th></tr></thead><tbody>${tbody}</tbody></table>`;
  document.getElementById('apply-overlay').style.display='flex';

  // 데이터 저장용
  document.getElementById('apply-confirm-btn')._data = { items, mDoc, mKey, staffNames, calMap };
});
document.getElementById('apply-overlay').addEventListener('click', e=>{ if(e.target===document.getElementById('apply-overlay')) document.getElementById('apply-overlay').style.display='none'; });

document.getElementById('apply-confirm-btn').addEventListener('click', async () => {
  const btn = document.getElementById('apply-confirm-btn');
  const { items, mDoc, mKey, staffNames, calMap } = btn._data;
  btn.textContent='반영 중...'; btn.disabled=true;
  try {
    const newStaffs = JSON.parse(JSON.stringify(mDoc.staffs||{}));
    staffNames.forEach(n=>{ if(!newStaffs[n]) newStaffs[n]={}; });

    // 1. 스케줄 신청 반영
    items.forEach(req=>{
      if (!staffNames.includes(req.name)) return;
      const s=new Date(req.startDate), e=new Date(req.endDate||req.startDate);
      for (let d=new Date(s);d<=e;d.setDate(d.getDate()+1))
        if(d.getFullYear()===curYear&&d.getMonth()+1===curMonth)
          newStaffs[req.name][String(d.getDate())] = req.type;
    });

    const now=new Date();
    const ts=`${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    await setDoc(doc(db,'artifacts','patek-s','public','data','schedules',mKey), {
      staffs: newStaffs, staffNames,
      lastUpdated: ts, updatedBy: auth.currentUser?.displayName||auth.currentUser?.email||'생성기'
    }, { merge: true });

    document.getElementById('apply-overlay').style.display='none';
    alert(`✅ ${items.length}건이 근무표에 반영됐습니다.`);
  } catch(e) { alert('오류: '+e.message); }
  finally { btn.textContent='반영하기'; btn.disabled=false; }
});

/* ── 직원 설정 ── */
document.getElementById('settings-btn').addEventListener('click', ()=>{
  const mKey=`${curYear}-${pad(curMonth)}`;
  const names=(schedulesData[mKey]?.staffNames)||Object.keys(DEF_ANNUAL);
  document.getElementById('settings-tbody').innerHTML=names.map(n=>{
    const m=staffList.find(s=>s.name===n)||{};
    return `<tr><td style="font-weight:700;">${n}</td>
    <td><input type="number" step=".5" min="0" id="sa-${n}" value="${m.annualLeave??DEF_ANNUAL[n]??15}"/></td>
    <td><input type="number" step=".5" min="0" id="st-${n}" value="${m.timeAllowance??DEF_TIME[n]??0}"/></td></tr>`;
  }).join('');
  document.getElementById('settings-overlay').style.display='flex';
});
document.getElementById('settings-overlay').addEventListener('click',e=>{ if(e.target===document.getElementById('settings-overlay')) document.getElementById('settings-overlay').style.display='none'; });
document.getElementById('settings-save-btn').addEventListener('click', async ()=>{
  const mKey=`${curYear}-${pad(curMonth)}`;
  const names=(schedulesData[mKey]?.staffNames)||Object.keys(DEF_ANNUAL);
  await Promise.all(names.map(n=>{
    const s=staffList.find(x=>x.name===n);
    if(!s?.id) return;
    const annual=parseFloat(document.getElementById(`sa-${n}`)?.value||0);
    const time=parseFloat(document.getElementById(`st-${n}`)?.value||0);
    return updateDoc(doc(db,'users',s.id),{annualLeave:annual,timeAllowance:time});
  }).filter(Boolean));
  document.getElementById('settings-overlay').style.display='none';
  alert('저장됐습니다!');
});

/* ── 엑셀 내보내기 ── */
document.getElementById('export-btn').addEventListener('click', ()=>{
  if(!window.XLSX){alert('라이브러리 로딩 중');return;}
  const total=getDays(curYear,curMonth);
  const mKey=`${curYear}-${pad(curMonth)}`;
  const mDoc=schedulesData[mKey]||{};
  const names=mDoc.staffNames||Object.keys(DEF_ANNUAL);
  const sMeta={}; staffList.forEach(s=>{sMeta[s.name]={annual:s.annualLeave??DEF_ANNUAL[s.name]??15};});
  const reqM={}; names.forEach(n=>{reqM[n]={};});
  leaveRequests.forEach(req=>{ if(!reqM[req.name]) return; const s=new Date(req.startDate),e=new Date(req.endDate||req.startDate); for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)) if(d.getFullYear()===curYear&&d.getMonth()+1===curMonth) reqM[req.name][d.getDate()]=req.type; });
  const header=['연차','이름',...Array.from({length:total},(_,i)=>`${i+1}`),'DO','A','B','C','사용연차','남은연차'];
  const data=names.map(n=>{
    const annual=(sMeta[n]?.annual??DEF_ANNUAL[n]??15);
    const uD=(mDoc.staffs||{})[n]||{};
    let cA=0,cB=0,cC=0,cAnn=0,cOff=0;
    const cells=Array.from({length:total},(_,i)=>{
      const d=i+1; const sc=uD[d]||uD[String(d)]||''; const rq=reqM[n][d];
      const code=sc||(rq||''); const disp=dispCode(code);
      const u=disp.toUpperCase();
      if(u==='A'||u==='A반') cA++; else if(u==='B'||u==='B반') cB++; else if(u==='C') cC++; else if(disp==='연') cAnn++; else cOff++;
      return disp;
    });
    return [annual,n,...cells,cOff,cA,cB,cC,cAnn,(annual-cAnn).toFixed(1)];
  });
  const ws=window.XLSX.utils.aoa_to_sheet([header,...data]);
  const wb=window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb,ws,`${curYear}년${curMonth}월`);
  window.XLSX.writeFile(wb,`스케줄_${curYear}년${curMonth}월.xlsx`);
});

/* ── 월 네비 ── */
document.getElementById('prev-btn').addEventListener('click',()=>{curMonth--;if(curMonth<1){curMonth=12;curYear--;}render();});
document.getElementById('next-btn').addEventListener('click',()=>{curMonth++;if(curMonth>12){curMonth=1;curYear++;}render();});

/* ── Firebase 리스너 ── */
function startListeners() {
  onSnapshot(collection(db,'artifacts','patek-s','public','data','schedules'),snap=>{schedulesData={};snap.docs.forEach(d=>{schedulesData[d.id]=d.data();});render();});
  onSnapshot(collection(db,'artifacts','patek-s','public','data','leave_requests'),snap=>{leaveRequests=snap.docs.map(d=>({id:d.id,...d.data()}));render();});
  onSnapshot(collection(db,'artifacts','patek-s','public','data','cal_events'),snap=>{calEvents=snap.docs.map(d=>({id:d.id,...d.data()}));render();});
  onSnapshot(collection(db,'artifacts','patek-s','public','data','time_requests'),snap=>{timeRequests=snap.docs.map(d=>({id:d.id,...d.data()}));render();});
  onSnapshot(collection(db,'users'),snap=>{staffList=snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.approved===true);render();});
}

/* ── 인증 ── */
onAuthStateChanged(auth,user=>{ if(user){document.getElementById('login-overlay').style.display='none';startListeners();}else{document.getElementById('login-overlay').style.display='flex';}});
document.getElementById('login-btn').addEventListener('click',async()=>{try{await signInWithPopup(auth,gp);}catch(e){if(e.code!=='auth/popup-closed-by-user')alert('로그인 오류: '+e.message);}});
document.getElementById('logout-btn').addEventListener('click',()=>signOut(auth));
</script>
