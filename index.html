<!-- =========================================================
공지사항 탭 수정 패치
기존 파일에서 아래 블록들을 교체/추가하세요.
========================================================= -->

<!-- 1) script 상단 상태값 추가
위치: window.appNotices = []; 바로 아래에 추가
-->
<script>
window.noticeSearchQuery = '';
window.noticeCategoryFilter = '전체';
window.noticeSortType = 'deadlineAsc';
window.selectedNoticeId = null;
</script>


<!-- 2) fetchNotices, renderNotices 전체 교체 -->
<script>
function fetchNotices() {
    const colRef = collection(db, 'notices');
    unsubscribeNotices = onSnapshot(colRef, (snapshot) => {
        window.appNotices = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderNotices();
    });
}

function normalizeSearchText(value) {
    return String(value || '').toLowerCase().replace(/\s+/g, '');
}

function getNoticeRegisterDate(notice) {
    return notice.registerDate || notice.date || notice.createdAt || '';
}

function getNoticeDeadlineDate(notice) {
    return notice.deadlineDate || notice.date || '';
}

window.renderNotices = function() {
    const list = document.getElementById('notice-list-content');
    if (!list) return;
    list.innerHTML = '';

    const query = normalizeSearchText(window.noticeSearchQuery);

    let filtered = [...window.appNotices];

    // 완료된 공지는 기본 리스트에서 숨김. 단, 검색어가 있으면 검색 결과에 노출.
    if (!query) {
        filtered = filtered.filter(notice => notice.completed !== true);
    }

    // 제목 + 내용 검색. 순서 상관없이 입력된 단어들이 모두 포함되면 검색.
    if (query) {
        const terms = query.split(/[,]+/).filter(Boolean);
        filtered = filtered.filter(notice => {
            const target = normalizeSearchText(`${notice.title || ''} ${notice.content || ''}`);
            return terms.every(term => target.includes(term));
        });
    }

    // 카테고리 필터
    if (window.noticeCategoryFilter !== '전체') {
        filtered = filtered.filter(notice => notice.category === window.noticeCategoryFilter);
    }

    // 정렬
    filtered.sort((a, b) => {
        if (window.noticeSortType === 'registerAsc') {
            return new Date(getNoticeRegisterDate(a) || '9999-12-31') - new Date(getNoticeRegisterDate(b) || '9999-12-31');
        }
        return new Date(getNoticeDeadlineDate(a) || '9999-12-31') - new Date(getNoticeDeadlineDate(b) || '9999-12-31');
    });

    if (filtered.length === 0) {
        list.innerHTML = '<div class="text-center text-[#999] py-10 text-sm">조건에 맞는 공지사항이 없습니다.</div>';
        return;
    }

    filtered.forEach(notice => {
        const catStyle = CATEGORIES[notice.category] || CATEGORIES['매장'];
        const readCount = notice.readers ? notice.readers.length : 0;
        const isRead = notice.readers && notice.readers.includes(currentUser.uid);
        const registerDate = getNoticeRegisterDate(notice) || '-';
        const deadlineDate = getNoticeDeadlineDate(notice) || '-';
        const completedBadge = notice.completed === true
            ? `<span class="text-[10px] font-bold text-[#777] bg-[#EFEFEF] px-2 py-0.5 rounded-md">완료</span>`
            : '';

        list.innerHTML += `
            <div onclick="openNoticeDetail('${notice.id}')" class="bg-white p-4 rounded-2xl border border-[#F0EFEA] shadow-sm cursor-pointer active:scale-[0.98] transition-transform mb-3">
                <div class="flex items-center gap-3">
                    <div class="px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap" style="background-color: ${catStyle.bg}; color: ${catStyle.text};">
                        ${notice.category}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 min-w-0">
                            <div class="truncate text-[15px] font-semibold text-[#333]">${notice.title || ''}</div>
                            ${completedBadge}
                        </div>
                        <div class="text-[11px] text-[#999] mt-1 font-medium truncate">등록 ${registerDate} · 마감 ${deadlineDate}</div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="text-xs font-semibold ${isRead ? 'text-[#B4975A]' : 'text-[#999]'}">${readCount} / ${MAX_READERS}</span>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-[#CCC]"></i>
                    </div>
                </div>
            </div>
        `;
    });
    lucide.createIcons();
};
</script>


<!-- 3) 공지사항 검색/필터/정렬 함수 추가
위치: renderNotices 아래 또는 공지사항 함수 영역
-->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('notice-search-input');
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            window.noticeSearchQuery = e.target.value;
            const clearBtn = document.getElementById('notice-search-clear');
            if (clearBtn) clearBtn.style.display = window.noticeSearchQuery ? 'block' : 'none';
            window.renderNotices();
        });
    }
});

window.clearNoticeSearch = function() {
    const searchInput = document.getElementById('notice-search-input');
    const clearBtn = document.getElementById('notice-search-clear');
    if (searchInput) searchInput.value = '';
    if (clearBtn) clearBtn.style.display = 'none';
    window.noticeSearchQuery = '';
    window.renderNotices();
};

window.setNoticeCategoryFilter = function(category, btnElement) {
    window.noticeCategoryFilter = category;
    document.querySelectorAll('.notice-filter-btn').forEach(btn => {
        btn.className = 'notice-filter-btn px-3 py-2 rounded-lg text-[12px] font-semibold whitespace-nowrap border bg-white text-[#8A847E] border-[#E8E4DB]';
    });
    if (btnElement) {
        btnElement.className = 'notice-filter-btn px-3 py-2 rounded-lg text-[12px] font-semibold whitespace-nowrap border bg-[#8B7355] text-white border-[#8B7355]';
    }
    window.renderNotices();
};

window.setNoticeSortType = function(value) {
    window.noticeSortType = value;
    window.renderNotices();
};

window.resetNoticeControls = function() {
    window.noticeSearchQuery = '';
    window.noticeCategoryFilter = '전체';
    window.noticeSortType = 'deadlineAsc';

    const searchInput = document.getElementById('notice-search-input');
    const clearBtn = document.getElementById('notice-search-clear');
    const sortSelect = document.getElementById('notice-sort-select');

    if (searchInput) searchInput.value = '';
    if (clearBtn) clearBtn.style.display = 'none';
    if (sortSelect) sortSelect.value = 'deadlineAsc';

    document.querySelectorAll('.notice-filter-btn').forEach(btn => {
        const isAll = btn.dataset.category === '전체';
        btn.className = isAll
            ? 'notice-filter-btn px-3 py-2 rounded-lg text-[12px] font-semibold whitespace-nowrap border bg-[#8B7355] text-white border-[#8B7355]'
            : 'notice-filter-btn px-3 py-2 rounded-lg text-[12px] font-semibold whitespace-nowrap border bg-white text-[#8A847E] border-[#E8E4DB]';
    });

    window.renderNotices();
};
</script>


<!-- 4) 공지사항 등록 관련 함수 교체 -->
<script>
window.openNoticeCreate = function() {
    document.getElementById('page-notice-create').style.display = 'flex';
    document.getElementById('bottom-nav-bar').style.display = 'none';

    window.selectedCategory = '';
    document.querySelectorAll('.cat-btn').forEach(b => {
        b.style.border = '1px solid #E5E5E5';
        b.style.fontWeight = 'normal';
    });

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('input-register-date').value = today;
    document.getElementById('input-deadline-date').value = '';
    document.getElementById('input-title').value = '';
    document.getElementById('input-content').value = '';
};

window.submitNotice = async function() {
    const registerDate = document.getElementById('input-register-date').value;
    const deadlineDate = document.getElementById('input-deadline-date').value;
    const title = document.getElementById('input-title').value.trim();
    const content = document.getElementById('input-content').value.trim();

    if (!window.selectedCategory || !title) {
        window.showCustomAlert('카테고리와 제목을 입력해주세요.');
        return;
    }

    if (!registerDate || !deadlineDate) {
        window.showCustomAlert('등록 날짜와 마감 날짜를 모두 선택해주세요.');
        return;
    }

    document.getElementById('loading-overlay').style.display = 'flex';
    try {
        await addDoc(collection(db, 'notices'), {
            category: window.selectedCategory,
            registerDate,
            deadlineDate,
            date: registerDate, // 기존 데이터 호환용
            title,
            content,
            author: currentUser.uid,
            createdAt: new Date().toISOString(),
            readers: [],
            completed: false,
            completedAt: ''
        });
        closeNoticeCreate();
    } catch(e) {
        console.error(e);
        window.showCustomAlert('등록 실패');
    } finally {
        document.getElementById('loading-overlay').style.display = 'none';
    }
};
</script>


<!-- 5) 공지사항 상세/수정/완료 함수 교체 및 추가 -->
<script>
window.openNoticeDetail = async function(id) {
    const notice = window.appNotices.find(n => n.id === id);
    if (!notice) return;

    window.selectedNoticeId = id;

    document.getElementById('page-notice-detail').style.display = 'flex';
    document.getElementById('bottom-nav-bar').style.display = 'none';

    const catStyle = CATEGORIES[notice.category] || CATEGORIES['매장'];
    const readCount = notice.readers ? notice.readers.length : 0;

    document.getElementById('detail-edit-cat-label').innerText = notice.category;
    document.getElementById('detail-edit-cat-label').style.backgroundColor = catStyle.bg;
    document.getElementById('detail-edit-cat-label').style.color = catStyle.text;

    document.getElementById('detail-edit-category').value = notice.category || '매장';
    document.getElementById('detail-edit-title').value = notice.title || '';
    document.getElementById('detail-edit-register-date').value = getNoticeRegisterDate(notice) || '';
    document.getElementById('detail-edit-deadline-date').value = getNoticeDeadlineDate(notice) || '';
    document.getElementById('detail-edit-content').value = notice.content || '';
    document.getElementById('detail-edit-count').innerText = `${readCount} / ${MAX_READERS}`;

    const completedText = document.getElementById('detail-completed-text');
    if (completedText) {
        completedText.innerText = notice.completed === true ? '완료된 공지' : '진행 중인 공지';
        completedText.className = notice.completed === true
            ? 'text-xs font-bold text-[#777] bg-[#EFEFEF] px-2 py-1 rounded-md'
            : 'text-xs font-bold text-[#B4975A] bg-[#F8F3E7] px-2 py-1 rounded-md';
    }

    if (!notice.readers || !notice.readers.includes(currentUser.uid)) {
        const currentReaders = notice.readers || [];
        if (currentReaders.length < MAX_READERS) {
            currentReaders.push(currentUser.uid);
            await updateDoc(doc(db, 'notices', notice.id), { readers: currentReaders });
            document.getElementById('detail-edit-count').innerText = `${currentReaders.length} / ${MAX_READERS}`;
        }
    }
};

window.saveNoticeEdit = async function() {
    if (!window.selectedNoticeId) return;

    const category = document.getElementById('detail-edit-category').value;
    const registerDate = document.getElementById('detail-edit-register-date').value;
    const deadlineDate = document.getElementById('detail-edit-deadline-date').value;
    const title = document.getElementById('detail-edit-title').value.trim();
    const content = document.getElementById('detail-edit-content').value.trim();

    if (!category || !title || !registerDate || !deadlineDate) {
        window.showCustomAlert('카테고리, 제목, 등록 날짜, 마감 날짜를 모두 입력해주세요.');
        return;
    }

    document.getElementById('loading-overlay').style.display = 'flex';
    try {
        await updateDoc(doc(db, 'notices', window.selectedNoticeId), {
            category,
            registerDate,
            deadlineDate,
            date: registerDate,
            title,
            content,
            updatedAt: new Date().toISOString(),
            updatedBy: currentUser.uid
        });
        window.showCustomAlert('공지사항이 수정되었습니다.');
        closeNoticeDetail();
    } catch(e) {
        console.error(e);
        window.showCustomAlert('수정 실패');
    } finally {
        document.getElementById('loading-overlay').style.display = 'none';
    }
};

window.completeNotice = function() {
    if (!window.selectedNoticeId) return;

    window.showCustomConfirm('이 공지사항을 완료 처리하시겠습니까?\n완료된 공지는 기본 리스트에서 숨겨지고, 검색 시에만 표시됩니다.', async () => {
        document.getElementById('loading-overlay').style.display = 'flex';
        try {
            await updateDoc(doc(db, 'notices', window.selectedNoticeId), {
                completed: true,
                completedAt: new Date().toISOString(),
                completedBy: currentUser.uid
            });
            window.showCustomAlert('완료 처리되었습니다.');
            closeNoticeDetail();
        } catch(e) {
            console.error(e);
            window.showCustomAlert('완료 처리 실패');
        } finally {
            document.getElementById('loading-overlay').style.display = 'none';
        }
    });
};

window.closeNoticeDetail = function() {
    window.selectedNoticeId = null;
    document.getElementById('page-notice-detail').style.display = 'none';
    document.getElementById('bottom-nav-bar').style.display = 'flex';
};
</script>

        <button data-category="행사" onclick="setNoticeCategoryFilter('행사', this)" class="notice-filter-btn px-3 py-2 rounded-lg text-[12px] font-semibold whitespace-nowrap border bg-white text-[#8A847E] border-[#E8E4DB]">행사</button>
    </div>

    <!-- 정렬 + 초기화 -->
    <div class="flex items-center gap-2 mb-4">
        <div class="flex-1 bg-white border border-[#E8E4DB] rounded-xl px-3 py-2.5 flex items-center shadow-sm">
            <i data-lucide="arrow-up-down" class="w-4 h-4 text-[#8A847E] mr-2"></i>
            <select id="notice-sort-select" onchange="setNoticeSortType(this.value)" class="w-full bg-transparent outline-none text-[13px] text-[#4A443F] font-semibold">

        </div>
        <button onclick="resetNoticeControls()" class="px-4 py-2.5 rounded-xl bg-[#F2EFE8] text-[#8B7355] text-[13px] font-bold border border-[#E8E4DB]">

        <div class="flex items-center justify-between">
            <div id="detail-edit-cat-label" class="inline-block px-3 py-1.5 rounded-lg text-sm font-bold">카테고리</div>
            <span id="detail-completed-text" class="text-xs font-bold text-[#B4975A] bg-[#F8F3E7] px-2 py-1 rounded-md">진행 중인 공지</span>
        </div>

        <div>
            <label class="block text-sm font-semibold text-[#666] mb-2">카테고리</label>
            <select id="detail-edit-category" class="w-full bg-white border border-[#E5E5E5] rounded-xl p-3.5 outline-none font-medium">
                <option value="매장">매장</option>
                <option value="본사">본사</option>
                <option value="PP">PP</option>
                <option value="백화점">백화점</option>
                <option value="행사">행사</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-semibold text-[#666] mb-2">등록 날짜</label>
                <input type="date" id="detail-edit-register-date" class="w-full bg-white border border-[#E5E5E5] rounded-xl p-3.5 outline-none font-medium text-[13px]" />
            </div>
            <div>
                <label class="block text-sm font-semibold text-[#666] mb-2">마감 날짜</label>
                <input type="date" id="detail-edit-deadline-date" class="w-full bg-white border border-[#E5E5E5] rounded-xl p-3.5 outline-none font-medium text-[13px]" />
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-[#666] mb-2">제목</label>
            <input id="detail-edit-title" type="text" class="w-full bg-white border border-[#E5E5E5] rounded-xl p-3.5 outline-none font-bold text-[#333]" />
        </div>

        <div>
            <label class="block text-sm font-semibold text-[#666] mb-2">내용</label>
            <textarea id="detail-edit-content" rows="8" class="w-full bg-white border border-[#E5E5E5] rounded-xl p-3.5 outline-none font-medium resize-none leading-relaxed"></textarea>
        </div>

        <!-- 눈 모양은 등록 화면에서는 제거하고, 수정 화면에서만 표시 -->
        <div class="bg-white border border-[#F2EFE8] rounded-xl p-4 flex items-center justify-center gap-3 text-[#B4975A] shadow-sm">
            <i data-lucide="eye" class="w-6 h-6"></i>
            <span id="detail-edit-count" class="font-bold text-xl">0 / 6</span>
        </div>
    </div>

    <div class="absolute bottom-0 w-full p-6 bg-white border-t border-[#F0EFEA] pb-8 flex gap-3">
        <button onclick="saveNoticeEdit()" class="flex-1 bg-[#B4975A] text-white py-4 rounded-xl text-[16px] font-bold shadow-md active:scale-95 transition-transform">수정</button>
        <button onclick="completeNotice()" class="flex-1 bg-[#4A443F] text-white py-4 rounded-xl text-[16px] font-bold shadow-md active:scale-95 transition-transform">완료</button>
    </div>
</div>
