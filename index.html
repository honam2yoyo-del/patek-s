<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Patek-S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #FAF9F5; margin: 0; color: #333; }
        .page { display: none; padding-bottom: 100px; }
        .page.active { display: block; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: white; border-top: 1px solid #F0EFEA; display: flex; justify-content: space-around; padding: 12px 0; z-index: 90; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #A0A0A0; cursor: pointer; flex: 1; font-size: 10px; font-weight: 600; }
        .nav-item.active { color: #B4975A; }
        #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100vh; background:rgba(250,249,245,0.9); z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCt7aQXA5eFdnDTMHlRhjPAkyH4b8UB6HY",
      authDomain: "patek-s.firebaseapp.com",
      projectId: "patek-s",
      storageBucket: "patek-s.firebasestorage.app",
      messagingSenderId: "786016749285",
      appId: "1:786016749285:web:58538eec1cf7e72068b60c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    window.appNotices = [];

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('login-page').style.display = 'none';
            checkApproval(user);
        } else {
            document.getElementById('login-page').style.display = 'flex';
            document.getElementById('app-container').style.display = 'none';
        }
    });

    function checkApproval(user) {
        onSnapshot(doc(db, 'users', user.uid), (docSnap) => {
            if (docSnap.exists() && docSnap.data().approved === true) {
                document.getElementById('app-container').style.display = 'block';
                document.getElementById('pending-page').style.display = 'none';
                fetchNotices();
            } else {
                document.getElementById('pending-page').style.display = 'flex';
            }
        });
    }

    function fetchNotices() {
        onSnapshot(collection(db, 'notices'), (snapshot) => {
            window.appNotices = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderNotices();
        });
    }

    window.renderNotices = function() {
        const list = document.getElementById('notice-list-content');
        list.innerHTML = window.appNotices.map(n => `
            <div onclick="openDetail('${n.id}')" class="bg-white p-4 rounded-xl border border-[#F0EFEA] mb-2 flex justify-between items-center">
                <span class="font-medium">${n.title}</span>
                <span class="text-xs text-[#B4975A] font-bold">${n.readers?.length || 0} / 6</span>
            </div>
        `).join('');
    };

    window.openDetail = async function(id) {
        const n = window.appNotices.find(n => n.id === id);
        if (!n.readers?.includes(currentUser.uid)) {
            const readers = n.readers || [];
            if(readers.length < 6) {
                readers.push(currentUser.uid);
                await updateDoc(doc(db, 'notices', id), { readers });
            }
        }
        alert(n.content);
    };

    window.loginWithGoogle = () => signInWithRedirect(auth, provider);
</script>

<!-- 로그인 -->
<div id="login-page" class="fixed inset-0 bg-[#FAF9F5] flex flex-col justify-center items-center z-[100]">
    <img src="log.png" class="w-40 mb-10">
    <button onclick="loginWithGoogle()" class="bg-white px-8 py-3 rounded-full shadow-md text-sm font-bold text-[#333]">Google 계정으로 시작</button>
</div>

<!-- 승인 대기 -->
<div id="pending-page" class="hidden fixed inset-0 bg-[#FAF9F5] flex-col justify-center items-center z-[90]">
    <img src="log.png" class="w-32 mb-8">
    <p class="text-[#666]">관리자 승인 대기 중입니다.</p>
</div>

<!-- 메인 앱 -->
<div id="app-container" class="hidden w-full max-w-md mx-auto min-h-screen">
    <div id="page-calendar" class="page active p-6"><h2 class="text-xl font-bold mb-4">캘린더</h2></div>
    <div id="page-notice" class="page p-6"><h2 class="text-xl font-bold mb-4">공지사항</h2><div id="notice-list-content"></div></div>
    
    <div class="bottom-nav">
        <div class="nav-item" onclick="switchTab('notice', this)"><i data-lucide="megaphone"></i><span>공지</span></div>
        <div class="nav-item active" onclick="switchTab('calendar', this)"><i data-lucide="calendar"></i><span>캘린더</span></div>
    </div>
</div>

<script>
    window.switchTab = (tab, el) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
        el.classList.add('active');
    };
    lucide.createIcons();
</script>
</body>
</html>
