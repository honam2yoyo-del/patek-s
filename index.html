<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 최적화 및 PWA(홈 화면 추가) 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patek-S</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Patek-S">
    <!-- 앱 아이콘 -->
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Patek_Philippe_logo.svg/512px-Patek_Philippe_logo.svg.png">

    <!-- Tailwind CSS (스타일링) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel (React 코드를 브라우저가 읽을 수 있게 변환) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#FAF9F5]">
    <div id="root"></div>

    <!-- ES Module을 사용하여 React 및 Firebase 로드 -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18';
        import { createRoot } from 'https://esm.sh/react-dom@18/client';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { 
          getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged,
          signInAnonymously, signInWithCustomToken, signOut
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { 
          getFirestore, collection, onSnapshot, doc, setDoc, getDoc, addDoc, updateDoc 
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { 
          Megaphone, CalendarDays, Calendar, BarChart3, 
          Package, Wrench, Star, Image as ImageIcon, 
          Plus, ChevronRight, X, Eye, ChevronDown, Check
        } from 'https://esm.sh/lucide-react@0.344.0';

        // ==========================================
        // 1. Firebase 설정 (이 부분을 본인의 설정으로 변경하세요)
        // ==========================================
        const IS_CANVAS = typeof __firebase_config !== 'undefined';
        let firebaseConfig = {
          apiKey: "AIzaSyBAGzTOYqnVFysfHvKKAw7KNX1QOnEXWmU",
          authDomain: "mymoneyapp-e6ef9.firebaseapp.com",
          projectId: "mymoneyapp-e6ef9",
          storageBucket: "mymoneyapp-e6ef9.firebasestorage.app",
          messagingSenderId: "461181649829",
          appId: "1:461181649829:web:ca70e6ed2ef0ed18a8de4c"
        };

        if (IS_CANVAS) {
          firebaseConfig = JSON.parse(__firebase_config);
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const getAppId = () => typeof __app_id !== 'undefined' ? __app_id : 'patek-s';
        const getBaseCollection = (collectionName) => {
          if (IS_CANVAS) return collection(db, 'artifacts', getAppId(), 'public', 'data', collectionName);
          return collection(db, collectionName);
        };

        // ==========================================
        // 2. 카테고리 및 UI 상수
        // ==========================================
        const CATEGORIES = [
          { id: '매장', label: '매장', bg: 'bg-[#F9E5E2]', text: 'text-[#D46B61]' },
          { id: '본사', label: '본사', bg: 'bg-[#E3EDFD]', text: 'text-[#5A85DB]' },
          { id: 'PP', label: 'PP', bg: 'bg-[#FCE6C3]', text: 'text-[#D69641]' },
          { id: '백화점', label: '백화점', bg: 'bg-[#E5E5E5]', text: 'text-[#7A7A7A]' },
          { id: '행사', label: '행사', bg: 'bg-[#EBE2FB]', text: 'text-[#8E67C9]' },
        ];

        const TABS = [
          { id: 'notice', label: '공지사항', icon: Megaphone },
          { id: 'schedule', label: '근무표', icon: CalendarDays },
          { id: 'calendar', label: '캘린더', icon: Calendar },
          { id: 'sales', label: '매출', icon: BarChart3 },
          { id: 'inventory', label: '재고', icon: Package },
          { id: 'as', label: 'A/S', icon: Wrench },
          { id: 'sp', label: 'SP', icon: Star },
          { id: 'album', label: '앨범', icon: ImageIcon }
        ];

        const MAX_READERS = 6;

        // ==========================================
        // 3. 서브 컴포넌트: 브랜드 헤더
        // ==========================================
        function BrandHeader() {
          return (
            <div className="flex flex-col items-center justify-center">
              <div className="text-[#B4975A] mb-1">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2L13 11L22 12L13 13L12 22L11 13L2 12L11 11L12 2Z" />
                </svg>
              </div>
              <h1 className="text-xl font-serif tracking-widest text-[#333]">PATEK PHILIPPE</h1>
              <p className="text-[9px] tracking-[0.3em] text-[#666] mt-1">GENEVE</p>
              <div className="w-[80%] flex items-center justify-center mt-5 opacity-50">
                <div className="h-[1px] w-full bg-[#B4975A]"></div>
                <div className="w-1.5 h-1.5 rotate-45 bg-[#B4975A] mx-2 flex-shrink-0"></div>
                <div className="h-[1px] w-full bg-[#B4975A]"></div>
              </div>
            </div>
          );
        }

        // ==========================================
        // 4. 서브 컴포넌트들 (캘린더, 공지사항)
        // ==========================================
        function CalendarScreen() {
          return (
            <div className="p-6 h-full flex flex-col">
              <h2 className="text-2xl font-serif text-center mb-8 animate-fade-in">캘린더</h2>
              <div className="bg-white rounded-2xl shadow-sm border border-[#F0EFEA] p-4 flex-1 flex items-center justify-center text-[#999]">
                달력 컴포넌트 영역
              </div>
            </div>
          );
        }

        function NoticeScreen({ user }) {
          const [notices, setNotices] = useState([]);
          const [view, setView] = useState('list');
          const [selectedNotice, setSelectedNotice] = useState(null);

          useEffect(() => {
            if (!user) return;
            const q = getBaseCollection('notices');
            const unsubscribe = onSnapshot(q, (snapshot) => {
              const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              items.sort((a, b) => new Date(b.date) - new Date(a.date));
              setNotices(items);
            }, (err) => {
              console.error("Failed to fetch notices:", err);
            });
            return () => unsubscribe();
          }, [user]);

          const handleReadNotice = async (notice) => {
            setSelectedNotice(notice);
            setView('detail');

            if (!notice.readers?.includes(user.uid)) {
              const currentReaders = notice.readers || [];
              if (currentReaders.length < MAX_READERS) {
                const noticeRef = doc(getBaseCollection('notices'), notice.id);
                await updateDoc(noticeRef, {
                  readers: [...currentReaders, user.uid]
                });
              }
            }
          };

          if (view === 'create') return <NoticeCreateScreen user={user} onClose={() => setView('list')} />;
          if (view === 'detail') return <NoticeDetailScreen notice={selectedNotice} onClose={() => setView('list')} />;

          return (
            <div className="p-6">
              <div className="flex justify-between items-center mb-8 relative">
                <div className="w-10"></div>
                <h2 className="text-2xl font-serif">공지사항</h2>
                <button onClick={() => setView('create')} className="w-10 h-10 flex items-center justify-center border border-[#E5E5E5] rounded-xl text-[#B4975A] bg-white shadow-sm">
                  <Plus size={20} />
                </button>
              </div>
              <div className="flex justify-between items-center mb-4">
                <div className="text-sm text-[#666] flex items-center gap-1">
                  정렬: 날짜순 <ChevronDown size={14} />
                </div>
              </div>
              <div className="space-y-3">
                {notices.map((notice) => {
                  const catStyle = CATEGORIES.find(c => c.id === notice.category) || CATEGORIES[0];
                  const readCount = notice.readers?.length || 0;
                  const isRead = notice.readers?.includes(user.uid);

                  return (
                    <div key={notice.id} onClick={() => handleReadNotice(notice)} className="bg-white p-4 rounded-2xl border border-[#F0EFEA] shadow-sm flex items-center gap-3 cursor-pointer active:scale-[0.98] transition-transform">
                      <div className={`${catStyle.bg} ${catStyle.text} px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap`}>
                        {notice.category}
                      </div>
                      <div className="flex-1 truncate text-[15px]">
                        [{notice.category}] {notice.title}
                      </div>
                      <div className="flex items-center gap-2">
                        <span className={`text-xs ${isRead ? 'text-[#B4975A]' : 'text-[#999]'}`}>{readCount}/{MAX_READERS}</span>
                        <ChevronRight size={18} className="text-[#CCC]" />
                      </div>
                    </div>
                  );
                })}
                {notices.length === 0 && <div className="text-center text-[#999] py-10">등록된 공지사항이 없습니다.</div>}
              </div>
            </div>
          );
        }

        function NoticeCreateScreen({ user, onClose }) {
          const [category, setCategory] = useState('');
          const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
          const [title, setTitle] = useState('');
          const [content, setContent] = useState('');
          const [isSubmitting, setIsSubmitting] = useState(false);

          const handleSubmit = async () => {
            if (!category || !date || !title || !content) return;
            setIsSubmitting(true);
            try {
              await addDoc(getBaseCollection('notices'), {
                category, date, title, content, author: user.uid, createdAt: new Date().toISOString(), readers: []
              });
              onClose();
            } catch (err) {
              console.error(err);
            } finally {
              setIsSubmitting(false);
            }
          };

          return (
            <div className="absolute inset-0 bg-[#FAF9F5] z-30 flex flex-col">
              <div className="pt-12 pb-4 bg-white flex-shrink-0 relative border-b border-[#F0EFEA]">
                <button onClick={onClose} className="absolute right-6 top-14 text-[#999]"><X size={24} /></button>
                <BrandHeader />
                <h2 className="text-2xl font-serif text-center mt-6 mb-2">공지사항 등록</h2>
              </div>
              <div className="flex-1 overflow-y-auto p-6 space-y-6 pb-32">
                <div>
                  <label className="block text-sm text-[#666] mb-3">카테고리 선택하기</label>
                  <div className="flex flex-wrap gap-2">
                    {CATEGORIES.map(cat => (
                      <button key={cat.id} onClick={() => setCategory(cat.id)} className={`px-4 py-2 rounded-lg text-sm transition-all border ${category === cat.id ? `${cat.bg} ${cat.text} border-transparent font-bold` : 'bg-white text-[#999] border-[#E5E5E5]'}`}>
                        {cat.label}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <label className="block text-sm text-[#666] mb-2">날짜</label>
                  <div className="relative">
                    <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full bg-white border border-[#E5E5E5] rounded-xl p-3.5 outline-none focus:border-[#B4975A] appearance-none" />
                    <CalendarDays className="absolute right-4 top-3.5 text-[#999] pointer-events-none" size={20} />
                  </div>
                </div>
                <div>
                  <label className="block text-sm text-[#666] mb-2">제목</label>
                  <input type="text" placeholder="제목을 입력하세요" value={title} onChange={(e) => setTitle(e.target.value)} className="w-full bg-white border border-[#E5E5E5] rounded-xl p-3.5 outline-none focus:border-[#B4975A]" />
                </div>
                <div>
                  <label className="block text-sm text-[#666] mb-2">내용</label>
                  <textarea rows="5" placeholder="내용을 입력하세요" value={content} onChange={(e) => setContent(e.target.value)} className="w-full bg-white border border-[#E5E5E5] rounded-xl p-3.5 outline-none focus:border-[#B4975A] resize-none" />
                </div>
                <div className="bg-[#FCFBF8] border border-[#F2EFE8] rounded-xl p-5 flex items-start gap-4">
                  <div className="w-12 h-12 rounded-full border border-[#E8E2D2] flex items-center justify-center flex-shrink-0 text-[#B4975A]"><Eye size={24} /></div>
                  <div>
                    <div className="font-serif text-[17px] mb-1">열람 카운트 0 / {MAX_READERS}</div>
                    <p className="text-xs text-[#666] leading-relaxed">읽은 사람은 중복 없이 집계되며,<br/>아이디별 최대 {MAX_READERS}명까지 카운팅됩니다.</p>
                  </div>
                </div>
              </div>
              <div className="absolute bottom-0 w-full p-6 bg-white border-t border-[#F0EFEA] pb-8 z-40">
                <button onClick={handleSubmit} disabled={isSubmitting || !category || !title} className="w-full bg-[#B4975A] text-white py-4 rounded-xl text-lg font-medium disabled:opacity-50">등록하기</button>
              </div>
            </div>
          );
        }

        function NoticeDetailScreen({ notice, onClose }) {
          if (!notice) return null;
          const catStyle = CATEGORIES.find(c => c.id === notice.category) || CATEGORIES[0];
          const readCount = notice.readers?.length || 0;

          return (
            <div className="absolute inset-0 bg-[#FAF9F5] z-30 flex flex-col">
              <div className="pt-12 pb-4 bg-white flex-shrink-0 relative border-b border-[#F0EFEA]">
                <button onClick={onClose} className="absolute right-6 top-14 text-[#999]"><X size={24} /></button>
                <BrandHeader />
              </div>
              <div className="flex-1 overflow-y-auto p-6">
                <div className="mb-6 border-b border-[#E5E5E5] pb-6">
                  <div className={`${catStyle.bg} ${catStyle.text} inline-block px-3 py-1.5 rounded-lg text-sm font-medium mb-3`}>{notice.category}</div>
                  <h2 className="text-xl font-medium mb-2 leading-snug">{notice.title}</h2>
                  <div className="flex justify-between items-center text-sm text-[#999]">
                    <span>{notice.date}</span>
                    <span className="flex items-center gap-1"><Eye size={14} /> 읽음 {readCount} / {MAX_READERS}</span>
                  </div>
                </div>
                <div className="text-[#333] whitespace-pre-wrap leading-relaxed text-[15px]">{notice.content}</div>
              </div>
            </div>
          );
        }

        // ==========================================
        // 5. 메인 앱 컴포넌트
        // ==========================================
        function App() {
          const [user, setUser] = useState(null);
          const [userData, setUserData] = useState(null);
          const [authLoading, setAuthLoading] = useState(true); // 초기 앱 로딩용
          const [isLoggingIn, setIsLoggingIn] = useState(false); // 버튼 클릭 시 로그인 진행 상태용
          const [currentTab, setCurrentTab] = useState('calendar');

          useEffect(() => {
            if (!auth) return;

            const initAuth = async () => {
              if (IS_CANVAS) {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              }
            };
            initAuth();

            // 모바일/PWA 리다이렉트 로그인 결과 처리
            getRedirectResult(auth).then((result) => {
              if (result && result.user) {
                setUser(result.user);
              }
              setIsLoggingIn(false);
            }).catch((err) => {
              console.error("Redirect Error:", err);
              setIsLoggingIn(false);
            });

            // 인증 상태 변화 감지
            const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
              setUser(currentUser);
              if (currentUser) {
                if (!IS_CANVAS) {
                  const userDocRef = doc(db, 'users', currentUser.uid);
                  const userSnap = await getDoc(userDocRef);
                  if (userSnap.exists()) {
                    setUserData(userSnap.data());
                  } else {
                    const newData = { 
                      name: currentUser.displayName || '이름 없음', 
                      email: currentUser.email || '', 
                      approved: false, 
                      role: 'user', 
                      createdAt: new Date().toISOString() 
                    };
                    await setDoc(userDocRef, newData);
                    setUserData(newData);
                  }
                } else {
                  // Canvas 시뮬레이터 가상 로그인 시 기본 승인 상태 처리
                  setUserData({ approved: true, name: '테스트 유저' });
                }
              } else {
                setUserData(null);
              }
              setAuthLoading(false);
              setIsLoggingIn(false);
            });
            return () => unsubscribe();
          }, []);

          // 첨부해주신 로그인 로직 완벽 반영
          const handleGoogleLogin = async () => {
            if (!auth) return;
            if (IS_CANVAS) return;

            setIsLoggingIn(true); // 버튼의 상태만 "로그인 중..."으로 변경
            try {
              const provider = new GoogleAuthProvider();
              const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
              const isPWA    = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

              if (isMobile || isPWA) {
                // 모바일 또는 PWA 환경에서는 리다이렉션 로그인 수행
                await signInWithRedirect(auth, provider);
              } else {
                // PC 환경에서는 즉시 로그인 팝업 호출
                await signInWithPopup(auth, provider);
              }
            } catch (error) {
              console.error("Google Login Error:", error);
              // Fallback: 커스텀 토큰 또는 익명 로그인
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
              setIsLoggingIn(false);
            }
          };

          // 초기 인증 상태 확인 중에만 띄우는 로딩
          if (authLoading) return <div className="h-screen flex items-center justify-center bg-[#FAF9F5] text-[#B4975A]">로딩중...</div>;

          // 로그인 화면
          if (!user || (IS_CANVAS && user.isAnonymous && !userData)) {
            return (
              <div className="w-full h-screen bg-[#DCD6CC] flex justify-center items-center font-sans px-4">
                <div className="w-full h-full max-w-md bg-[#FCFBF9] shadow-[0_0_50px_rgba(0,0,0,0.15)] flex flex-col items-center justify-center font-serif relative px-6 rounded-3xl md:h-[90vh]">
                  <img src="log.png" alt="Patek Philippe" className="w-56 h-auto mb-16 object-contain" />
                  
                  <button 
                    onClick={handleGoogleLogin} 
                    disabled={isLoggingIn}
                    className={`flex items-center gap-4 bg-white border border-[#E8E4DB] px-6 py-4 rounded-full shadow-[0_4px_15px_rgba(0,0,0,0.05)] transition-all w-full justify-center ${isLoggingIn ? 'opacity-50 cursor-not-allowed' : 'active:scale-95 hover:bg-[#F2EFE8]'}`}
                  >
                    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    <span className="font-sans text-[14px] font-medium text-[#4A443F]">
                      {isLoggingIn ? '로그인 중...' : 'Google 계정으로 시작하기'}
                    </span>
                  </button>
                  {IS_CANVAS && <p className="mt-4 text-xs text-center text-red-400 font-sans">* 미리보기 환경에서는 실제 로그인이 제한될 수 있습니다. 배포 후 정상 작동합니다.</p>}
                </div>
              </div>
            );
          }

          // 관리자 승인 대기 화면
          if (userData && !userData.approved) {
            return (
              <div className="max-w-md mx-auto h-screen bg-[#FAF9F5] flex flex-col items-center justify-center p-6 font-serif">
                <BrandHeader />
                <div className="mt-12 text-center font-sans">
                  <h2 className="text-xl font-bold text-[#333] mb-2">승인 대기 중</h2>
                  <p className="text-[#666] mb-8">관리자의 승인 후 이용하실 수 있습니다.</p>
                  <button onClick={() => signOut(auth)} className="text-[#999] underline text-sm">로그아웃</button>
                </div>
              </div>
            );
          }

          // 정상 승인 유저 메인 화면 (기본 탭: 캘린더)
          return (
            <div className="max-w-md mx-auto h-[100dvh] bg-[#FAF9F5] flex flex-col relative overflow-hidden font-sans text-[#333]">
              <div className="pt-12 pb-4 bg-white flex-shrink-0 rounded-b-3xl shadow-[0_4px_20px_rgba(0,0,0,0.02)] z-10 relative">
                <BrandHeader />
              </div>
              <div className="flex-1 overflow-y-auto pb-[100px] no-scrollbar">
                {currentTab === 'calendar' && <CalendarScreen />}
                {currentTab === 'notice' && <NoticeScreen user={user} />}
                {['schedule', 'sales', 'inventory', 'as', 'sp', 'album'].includes(currentTab) && (
                  <div className="flex items-center justify-center h-full text-[#999]">
                    {TABS.find(t => t.id === currentTab)?.label} 준비중입니다.
                  </div>
                )}
              </div>
              <div className="absolute bottom-0 w-full bg-white rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.05)] p-4 pb-8 z-20">
                <div className="grid grid-cols-4 gap-y-6 gap-x-2">
                  {TABS.map((tab) => {
                    const Icon = tab.icon;
                    const isActive = currentTab === tab.id;
                    return (
                      <button key={tab.id} onClick={() => setCurrentTab(tab.id)} className={`flex flex-col items-center gap-1.5 transition-colors ${isActive ? 'text-[#B4975A]' : 'text-[#A0A0A0]'}`}>
                        <Icon size={24} strokeWidth={isActive ? 2 : 1.5} />
                        <span className="text-[10px] font-medium">{tab.label}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        }

        // ==========================================
        // 6. React 앱 렌더링
        // ==========================================
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
